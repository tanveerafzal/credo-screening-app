<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CredoScreening LinkedIn Logo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* LinkedIn logo: 300x300 */
  .logo {
    width: 300px;
    height: 300px;
    background: #0F2B46;
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  .logo::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
    background-size: 20px 20px;
  }

  .icon-wrap {
    position: relative;
    z-index: 1;
    width: 80px;
    height: 80px;
    background: #0D9488;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(13,148,136,0.3);
  }

  .icon-wrap svg {
    width: 44px;
    height: 44px;
  }

  .text {
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .name {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.03em;
  }

  .name span {
    color: #2DD4BF;
  }

  .sub {
    font-size: 11px;
    font-weight: 500;
    color: #64748B;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-top: 4px;
  }
</style>
</head>
<body style="background:#1a1a2e; display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div class="logo">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
    </div>
    <div class="text">
      <div class="name">Trust<span>Credo</span></div>
      <div class="sub">Equifax Credit Verification Partner</div>
    </div>
  </div>
</body>
</html>
