<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Shield body -->
  <path d="M100 10 L180 50 L180 110 C180 155 145 185 100 195 C55 185 20 155 20 110 L20 50 Z" fill="url(#grad)" stroke="url(#grad)" stroke-width="2"/>

  <!-- Lock body -->
  <rect x="72" y="95" width="56" height="45" rx="8" fill="white" opacity="0.95"/>

  <!-- Lock shackle -->
  <path d="M80 95 L80 78 C80 63 88 55 100 55 C112 55 120 63 120 78 L120 95" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.95"/>

  <!-- Keyhole -->
  <circle cx="100" cy="113" r="7" fill="url(#grad)"/>
  <rect x="97" y="117" width="6" height="10" rx="2" fill="url(#grad)"/>

  <!-- Checkmark on shield -->
  <path d="M60 72 L75 87 L95 60" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
</svg>
